<div class="page">

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">🍽 Smart Catering</div>

<div class="nav-links">

<span (click)="goHome()">🏠 Home</span>

<span (click)="goToMenu()">📋 Menu</span>

<span (click)="goToAccount()">👤 Account</span>

</div>

</nav>


<!-- HERO -->

<div class="hero">

<h1>Fresh, Healthy Meals</h1>

<p>Delivered to your door</p>

<button (click)="bookCatering()">
BOOK CATERING →
</button>

</div>


<!-- SEARCH -->

<div class="search-container">

<input
type="text"
placeholder="Search catering services..."
[(ngModel)]="searchText"
(input)="onSearchChange()"
(keyup.enter)="search()"
/>

<button class="search-btn" (click)="search()">
➜
</button>

</div>


<!-- OPTIONS -->

<div class="options">

<div class="card yellow" (click)="bookCatering()">
📅 Book Catering
</div>

<div class="card green" (click)="goToSubscription()">
💳 Meal Subscription
</div>

</div>


<!-- TOP CATERERS -->

<div class="caterers">

<div class="header">

<h2>Top Caterers</h2>

<button class="view-all-btn" (click)="viewAllVendors()">
View All →
</button>

</div>


<!-- VENDOR LIST (NOW DYNAMIC FOR SEARCH) -->

<div class="caterer-card" *ngFor="let vendor of filteredVendors">

<div>
<h3>{{vendor.name}}</h3>

<p>{{vendor.description}}</p>

</div>

<button (click)="viewVendor(vendor)">
View Vendor
</button>

</div>


</div>

</div>
