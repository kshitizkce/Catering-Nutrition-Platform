<app-navbar [userEmail]="userEmail"></app-navbar>

<div class="page">

  <!-- CONTENT -->
  <div class="container">

    <h1 class="title">Select a Vendor</h1>
    <p class="subtitle">Choose from our trusted nutrition partners</p>

    <div class="vendor-grid">

      <div class="vendor-card" *ngFor="let v of vendors">

        <!-- IMAGE -->
        <div class="image-wrapper">
          <img 
            [src]="v.businessLogo ? 'https://a711-192-197-60-11.ngrok-free.app' + v.businessLogo : 'https://via.placeholder.com/300x200'" 
            alt="vendor">
          
          <!-- STATUS BADGE -->
          <span class="status-badge" [ngClass]="isVendorOpen(v) ? 'open' : 'closed'">
            {{ isVendorOpen(v) ? 'Open' : 'Closed' }}
          </span>
        </div>

        <div class="card-body">

          <!-- HEADER -->
          <div class="header">
            <h3>{{v.businessName}}</h3>
            <span class="rating">⭐ {{v.rating || 4.5}}</span>
          </div>

          <!-- DESCRIPTION -->
          <p class="desc">{{v.businessDescription}}</p>

          <!-- META INFO -->
          <div class="meta">
            <div>📍 {{v.city}}</div>
            <div>🍱 {{v.serviceType}}</div>
          </div>

          <!-- BUSINESS HOURS -->
          <div class="hours-box">
            <div class="hours-title">Today Hours</div>
            <div class="hours-value">{{ getTodayHours(v) }}</div>
          </div>

          <!-- NEXT OPEN -->
          <div *ngIf="!isVendorOpen(v)" class="next-open">
            ⏰ Opens {{ getNextOpenTime(v) }}
          </div>

          <!-- ACTION -->
          <button 
            class="view-btn"
            (click)="viewVendor(v)"
            [disabled]="!isVendorOpen(v)"
            [ngClass]="{'disabled': !isVendorOpen(v)}">

            {{ isVendorOpen(v) ? 'View Menu' : 'Closed' }}
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
