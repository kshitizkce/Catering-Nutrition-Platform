<div class="card">

<h2>Forgot Password</h2>

<label>Email Address</label>

<div class="input-box">
<span>✉️</span>
<input type="email" [(ngModel)]="email" placeholder="your@email.com">
</div>

<button type="button" class="login-btn" (click)="sendResetLink()">Change Password</button>

<p class="switch-text">
Remember password?
<span (click)="goBack()">Login</span>
</p>

</div>
