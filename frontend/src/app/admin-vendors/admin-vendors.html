<div class="vendors">
  <h2>Vendors</h2>
  <input type="text" placeholder="Search vendors..." [(ngModel)]="searchText" class="search" />

  <div class="filters">
    <button (click)="setFilter('All')" [class.active]="selectedFilter==='All'">All</button>
    <button (click)="setFilter('Active')" [class.active]="selectedFilter==='Active'">Active</button>
    <button (click)="setFilter('Inactive')" [class.active]="selectedFilter==='Inactive'">Inactive</button>
    <button (click)="setFilter('Verified')" [class.active]="selectedFilter==='Verified'">Verified</button>
    <button (click)="setFilter('Not Verified')" [class.active]="selectedFilter==='Not Verified'">Not Verified</button>
  </div>

  <table *ngIf="!loading">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>City</th>
        <th>Address</th>
        <th>Rating</th>
        <th>Business Hours</th>
        <th>Logo</th>
        <th>File</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of filteredVendors" style="cursor:pointer" (click)="openVendor(v)">
        <td>{{ v.vendorName }}</td>
        <td>{{ v.vendorEmail }}</td>
        <td>{{ v.vendorPhone }}</td>
        <td>{{ v.city }}</td>
        <td>{{ v.vendorAddress || 'N/A' }}</td>
        <td>{{ v.rating ?? 'N/A' }}</td>
        <td>{{ v.businessHours || 'N/A' }}</td>

        <!-- LOGO IMAGE -->
        <td>
          <img *ngIf="v.businessLogo" [src]="getVendorFileUrl(v.businessLogo)" width="40" height="40" />
          <span *ngIf="!v.businessLogo">N/A</span>
        </td>

        <!-- FILE LINK -->
        <td>
          <a *ngIf="v.businessFile" [href]="getVendorFileUrl(v.businessFile)" target="_blank">
            View
          </a>
          <span *ngIf="!v.businessFile">N/A</span>
        </td>

        <td>{{ v.status }}</td>

        <!-- ACTIONS -->
        <td (click)="$event.stopPropagation()">
          <button (click)="approve(v)">Approve</button>
          <button (click)="reject(v)">Reject</button>
          <button class="delete-btn" (click)="deleteVendor(v.vendorId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="loading">Loading vendors...</p>
</div>
