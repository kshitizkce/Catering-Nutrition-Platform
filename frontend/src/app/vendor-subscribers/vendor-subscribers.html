<div class="dashboard">

  <!-- SUBSCRIBERS SECTION -->
  <div class="section-title">
    <h3>Subscribers List</h3>
    <p>Manage your subscribers</p>
  </div>

  <div *ngIf="subscribersLoaded && subscribers.length > 0; else noSubscribers">
    <table>
      <tr>
        <th>Name</th>
        <th>Plan</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
      <tr *ngFor="let s of subscribers">
        <td>{{ s.name }}</td>
        <td>
          <span *ngIf="!editingSubscriber || editingSubscriber.subscriberId !== s.subscriberId">
            {{ s.plan }}
          </span>
          <select *ngIf="editingSubscriber && editingSubscriber.subscriberId === s.subscriberId"
                  [(ngModel)]="editingSubscriber.plan"
                  [disabled]="!isOpen">
            <option value="Free">Free</option>
            <option value="Paid">Paid</option>
          </select>
        </td>
        <td>{{ s.status }}</td>
        <td>
          <button *ngIf="!editingSubscriber || editingSubscriber.subscriberId !== s.subscriberId"
                  (click)="editSubscriber(s)"
                  [disabled]="!isOpen">
            Update Plan
          </button>
          <span *ngIf="editingSubscriber && editingSubscriber.subscriberId === s.subscriberId">
            <button (click)="saveSubscriber()">Save</button>
            <button (click)="cancelEdit()">Cancel</button>
          </span>
        </td>
      </tr>
    </table>
  </div>

  <ng-template #noSubscribers>
    <p>No subscribers found.</p>
  </ng-template>

</div>
