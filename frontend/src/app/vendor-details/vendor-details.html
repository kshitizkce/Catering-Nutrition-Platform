<div class="vendor-menu-page">

<h1>Vendor Menu</h1>

<div class="menu-grid">

<div class="menu-card" *ngFor="let item of menuItems">

<img [src]="item.imageUrl" alt="food">

<h3>{{item.name}}</h3>

<p>{{item.description}}</p>

<div class="nutrition">

<span>🔥 Calories: {{item.calories}}</span>
<span>💪 Protein: {{item.protein}}g</span>
<span>🥑 Fat: {{item.fat}}g</span>
<span>🍞 Carbs: {{item.carbs}}g</span>

</div>

<div class="price">
$ {{item.price}}
</div>

</div>

</div>

</div>
