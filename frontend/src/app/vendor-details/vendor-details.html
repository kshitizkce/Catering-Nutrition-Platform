<div class="page">

  <app-navbar [userEmail]="userEmail"></app-navbar>

  <div class="container">

    <!-- BACK -->
    <div class="back" (click)="goBack()">← Back to Vendors</div>

    <!-- HEADER -->
    <div class="vendor-header">
      <h1>{{ vendorName || 'Vendor Menu' }}</h1>
    </div>

    <!-- CATEGORY FILTER -->
    <div class="category-bar">

      <button
        *ngFor="let c of categories"
        (click)="filterByCategory(c.categoryId)"
        [class.active]="selectedCategoryId === c.categoryId">

        {{ c.categoryName }}

      </button>

    </div>

    <!-- MENU GRID -->
    <div class="menu-grid">

      <div class="menu-card" *ngFor="let item of menu">

        <img
          [src]="item.imageUrl ? item.imageUrl : 'https://via.placeholder.com/300x200'"
          alt="meal">

        <h3>{{ item.itemName }}</h3>
        <p>{{ item.itemDescription }}</p>

        <!-- ⭐ RATING -->
        <div class="rating">
          <span *ngFor="let star of [1,2,3,4,5]">
            <i [class.filled]="star <= item.rating">★</i>
          </span>
          <span class="rating-value">
            {{ item.rating || 0 }}
          </span>
        </div>

        <div class="nutrition">
          <div><span>Calories</span><b>{{ item.calories }}</b></div>
          <div><span>Price</span><b>${{ item.price }}</b></div>
        </div>

        <div class="actions">



<!-- 🍱 CUSTOMIZE (ONLY if subscribed) -->
<button 
  *ngIf="hasSubscriptionRecord && isSubscribed"
  (click)="goToCustomize(item)"
  class="customize-btn"
  [disabled]="currentCount >= mealsLimit">
  Customize Meal
</button>

<!-- 🛒 ADD TO CART (ALWAYS visible) -->
<button 
  (click)="orderNow(item)" 
  class="order-btn">
  Add to Cart
</button>

</div>

      </div>

    </div>

  </div>

</div>
